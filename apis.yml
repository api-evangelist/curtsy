name: Curtsy
description: Curtsy is a mobile-first resale marketplace for secondhand women's fashion,
  focused on Gen Z and young-millennial shoppers roughly ages 15 to 30. Through its free
  iOS and Android apps, users buy and sell trending clothing, shoes, and accessories from
  brands like Lululemon, Free People, and SKIMS, saving up to 70% off retail. Curtsy holds
  no inventory of its own — sellers ship directly to buyers using prepaid shipping labels and
  free Curtsy-branded starter kits — and the company earns a 20% fee on each completed sale.
  Founded in 2016 as part of Y Combinator's Summer 2016 batch and headquartered in San
  Francisco, Curtsy has raised venture funding from Canaan Partners and Index Ventures. Curtsy
  is a consumer app with no public developer API, SDKs, or documentation surface at this time.
